name: Build release DMG

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload to
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_NAME }}
      NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
      BUILD_NUMBER: ${{ github.run_number }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      SPARKLE_VERSION: 2.9.2

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Validate release version
        run: |
          set -euo pipefail
          app_version="$(
            xcodebuild \
              -project ZoneBar.xcodeproj \
              -scheme ZoneBar \
              -configuration Release \
              -showBuildSettings |
              awk '/MARKETING_VERSION/ { print $3; exit }'
          )"
          if [[ "$RELEASE_TAG" != "v$app_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match app version v$app_version."
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/zonebar-signing.keychain-db"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -k "$keychain_path"
          security list-keychain -d user -s \
            "$keychain_path" \
            "$HOME/Library/Keychains/login.keychain-db" \
            "/Library/Keychains/System.keychain"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning |
              awk '/Developer ID Application/ { print $2; exit }'
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "Developer ID Application identity was not imported."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "NOTARY_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          xcodebuild \
            -project ZoneBar.xcodeproj \
            -scheme ZoneBar \
            -destination "platform=macOS" \
            -skip-testing:ZoneBarTests/SnapshotTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build, sign, and notarize DMG
        run: ./scripts/release-dmg.sh

      - name: Generate signed update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools_dir"
          gh release download "$SPARKLE_VERSION" \
            --repo sparkle-project/Sparkle \
            --pattern "Sparkle-${SPARKLE_VERSION}.tar.xz" \
            --dir "$tools_dir"
          tar -xf "$tools_dir/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -C "$tools_dir"

          dmg_path="$(find build/release -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "No release DMG was found for the update feed."
            exit 1
          fi

          notes_path="${dmg_path%.dmg}.md"
          gh release view "$RELEASE_TAG" --json body --jq '.body' > "$notes_path"

          printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" |
            "$tools_dir/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix \
                "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
              --link "https://github.com/${GITHUB_REPOSITORY}" \
              --embed-release-notes \
              --maximum-deltas 0 \
              -o build/release/appcast.xml \
              build/release

          test -s build/release/appcast.xml

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoneBar-${{ env.RELEASE_TAG }}
          path: |
            build/release/*.dmg
            build/release/*.sha256
            build/release/appcast.xml
          if-no-files-found: error

      - name: Attach DMG to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            build/release/*.dmg \
            build/release/*.sha256 \
            build/release/appcast.xml \
            --clobber
